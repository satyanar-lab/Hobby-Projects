name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: body_control_zonal_lighting

jobs:
  linux-build:
    name: Linux Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libboost-all-dev libasio-dev zlib1g-dev \
            libssl-dev libsystemd-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls

      - name: Cache vsomeip
        id: cache-vsomeip
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/libvsomeip3*
          key: vsomeip-3.4.10-ubuntu24

      - name: Build vsomeip from source
        if: steps.cache-vsomeip.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch 3.4.10 \
            https://github.com/COVESA/vsomeip.git
          cd vsomeip
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DENABLE_SIGNAL_HANDLING=OFF \
                -DCMAKE_CXX_FLAGS="-Wno-error=stringop-overflow" \
                ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: body_control_zonal_lighting/build/Testing/
          retention-days: 7
