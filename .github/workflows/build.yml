name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: body_control_zonal_lighting

jobs:
  linux-build:
    name: Linux Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libboost-all-dev libasio-dev zlib1g-dev \
            libssl-dev libsystemd-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls

      - name: Cache vsomeip
        id: cache-vsomeip
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/libvsomeip3*
          key: vsomeip-3.4.10-ubuntu24

      - name: Build vsomeip from source
        if: steps.cache-vsomeip.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch 3.4.10 \
            https://github.com/COVESA/vsomeip.git
          cd vsomeip
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DENABLE_SIGNAL_HANDLING=OFF \
                -DCMAKE_CXX_FLAGS="-Wno-error=stringop-overflow" \
                ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: body_control_zonal_lighting/build/Testing/
          retention-days: 7

  static-analysis-cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppressions-list=cppcheck-suppressions.txt \
            --inline-suppr \
            --error-exitcode=1 \
            --std=c++17 \
            -I include/ \
            src/ app/ 2>&1

  static-analysis-sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    needs: linux-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install vss-tools
        run: pip install -r vss/requirements.txt

      - name: Configure
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DBODY_CONTROL_LIGHTING_BUILD_VSS=ON

      - name: Build
        run: cmake --build build-san -j$(nproc)

      - name: Run tests under ASan + UBSan
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:print_stacktrace=1:symbolize=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1:print_summary=1"
        run: ctest --test-dir build-san --output-on-failure

  static-analysis-clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build clang-tidy \
            libboost-all-dev libasio-dev zlib1g-dev \
            libssl-dev libsystemd-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls

      - name: Cache vsomeip
        id: cache-vsomeip
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/libvsomeip3*
          key: vsomeip-3.4.10-ubuntu24

      - name: Build vsomeip from source
        if: steps.cache-vsomeip.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch 3.4.10 \
            https://github.com/COVESA/vsomeip.git
          cd vsomeip
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DENABLE_SIGNAL_HANDLING=OFF \
                -DCMAKE_CXX_FLAGS="-Wno-error=stringop-overflow" \
                ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Generate compile_commands.json
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find src/application src/transport/some_ip_sd \
               src/service src/transport/ethernet src/domain \
               app/central_zone_controller \
               app/exterior_lighting_node_simulator \
               app/diagnostic_console \
               -name "*.cpp" | \
            xargs clang-tidy -p build/ --quiet

  vss-build-test:
    name: VSS build and test
    runs-on: ubuntu-24.04
    needs: linux-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libboost-all-dev libasio-dev zlib1g-dev \
            libssl-dev libsystemd-dev \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls

      - name: Cache vsomeip
        id: cache-vsomeip
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/libvsomeip3*
            /usr/local/include/vsomeip
            /usr/local/lib/cmake/vsomeip3
            /usr/local/lib/pkgconfig/vsomeip3.pc
          key: vsomeip-3.4.10-ubuntu24

      - name: Build vsomeip from source
        if: steps.cache-vsomeip.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          git clone --depth 1 --branch 3.4.10 \
            https://github.com/COVESA/vsomeip.git
          cd vsomeip
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DENABLE_SIGNAL_HANDLING=OFF \
                -DCMAKE_CXX_FLAGS="-Wno-error=stringop-overflow" \
                ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Refresh dynamic linker cache
        run: sudo ldconfig

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install vss-tools
        run: pip install -r vss/requirements.txt

      - name: Configure with VSS=ON
        run: |
          cmake -S . -B build_vss \
            -DBODY_CONTROL_LIGHTING_BUILD_VSS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_vss -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build_vss --output-on-failure

      - name: Verify --vss-snapshot flag wired in
        run: ./build_vss/app/diagnostic_console --help | grep -- --vss-snapshot
