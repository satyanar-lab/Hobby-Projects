# mcuboot.conf — Kconfig overrides for the MCUboot child image.
#
# Applied only to the MCUboot build, not to the application image.
# Sysbuild merges this with the MCUboot defaults when --sysbuild is used.

# swap-using-move: supports rollback via boot_request_upgrade(BOOT_UPGRADE_TEST)
# + boot_write_img_confirmed() without a dedicated scratch partition.
# Chosen over overwrite-only (no rollback) and swap-using-scratch (extra wear).
CONFIG_BOOT_SWAP_USING_MOVE=y

# Maximum number of flash erase sectors MCUboot tracks per slot.
# STM32H753ZI: 768 KB slot / 128 KB erase block = 6 sectors; 8 gives headroom.
CONFIG_BOOT_MAX_IMG_SECTORS=8

# ECDSA-P256: ~50 ms boot-time verify on Cortex-M7 (vs ~1500 ms for RSA-2048).
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

CONFIG_LOG=y
CONFIG_BOOT_BANNER=y
