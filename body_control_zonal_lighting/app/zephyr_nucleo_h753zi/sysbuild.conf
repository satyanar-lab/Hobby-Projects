# sysbuild.conf — multi-image build configuration for MCUboot + application.
#
# Picked up automatically by west build --sysbuild.  Instructs sysbuild to
# build the MCUboot child image and sign the application image with imgtool.
#
# Signing key: MCUboot test ECDSA-P256 key — suitable for portfolio / demo.
# Never use this key in production; generate a project-specific key with:
#   imgtool keygen -k my_signing_key.pem -t ecdsa-p256
#
# Build command:
#   west build -b nucleo_h753zi --sysbuild \
#     ~/workspace/Hobby-Projects/body_control_zonal_lighting/app/zephyr_nucleo_h753zi
#
# Signed image location after build:
#   build/zephyr_nucleo_h753zi/zephyr/zephyr.signed.bin

SB_CONFIG_BOOTLOADER_MCUBOOT=y
# ECDSA-P256: ~50 ms boot verification on Cortex-M7 vs ~1500 ms for RSA-2048.
# The MCUboot bootloader child image picks up the test key automatically via
# its Kconfig default: $(ZEPHYR_BASE)/../bootloader/mcuboot/root-ec-p256.pem
# DEMO KEY — never use in production.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
